# Not a deviation, a known gap: the main ruleset (id 26504718) has no
# required_status_checks rule yet because there is no CI to report one.
# Add it with PUT (docs/branch-protection-ruleset.md, "Updating an existing
# ruleset") once the first tool's CI has reported on a PR. TKFW-95.

deviations:
  - standard: branching-and-release
    item: no vX.Y.Z/main release branches
    kind: opt-out
    reason: >
      hearth holds several independent Discord tools, each versioned and
      released on its own, so a single repo-wide vX.Y.Z/main release branch
      does not fit. Topic branches (feature/TKFW-N-topic) are cut from main and
      PR straight into main; no release-branches ruleset. The org doc has no
      provision for a multi-tool repo yet, so this needs an org-level decision
      (and a per-tool release workflow) before the first tool ships.
    since: 2026-11-03
